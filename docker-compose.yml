# Production-oriented compose for Timeweb / Ubuntu host.
# Nginx on the host should proxy to 127.0.0.1:${QRPR_PORT}.
# Do not publish 0.0.0.0 if a reverse proxy already terminates TLS.

services:
  qrpr:
    build: .
    container_name: qrpr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      # Host bind defaults to loopback — change QRPR_PORT if 3010 is taken.
      - "127.0.0.1:${QRPR_PORT:-3010}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
